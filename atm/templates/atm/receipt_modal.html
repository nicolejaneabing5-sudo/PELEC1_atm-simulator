{% load static %}
<dialog class="receipt-modal" id="receipt-modal" aria-labelledby="receipt-title">
    <form method="dialog">
        <button class="legal-close" aria-label="Close receipt">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
        </button>
    </form>

    <article class="receipt">
        <header class="receipt-top">
            <img class="receipt-logo" src="{% static 'images/bank_logo.png' %}" alt="ABC Bank Logo">
            <p class="receipt-shop">ATM Simulator</p>
        </header>

        <div class="receipt-hero">
            <span class="receipt-icon receipt-icon--in" id="receipt-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path id="receipt-icon-path" stroke-linecap="round" stroke-linejoin="round" d="" />
                </svg>
            </span>
            <h2 class="receipt-status" id="receipt-title">Transaction successful</h2>
            <p class="receipt-amount" id="receipt-amount">₱0.00</p>
            <p class="receipt-type" id="receipt-type">Deposit</p>
        </div>

        <dl class="receipt-rows">
            <div class="receipt-row">
                <dt>Account</dt>
                <dd id="receipt-account">—</dd>
            </div>
            <div class="receipt-row">
                <dt>Description</dt>
                <dd id="receipt-description">—</dd>
            </div>
            <div class="receipt-row">
                <dt>Date</dt>
                <dd id="receipt-date">—</dd>
            </div>
            <div class="receipt-row">
                <dt>Reference</dt>
                <dd class="receipt-ref" id="receipt-ref">—</dd>
            </div>
            <div class="receipt-row receipt-total">
                <dt>Balance after</dt>
                <dd id="receipt-balance">₱0.00</dd>
            </div>
        </dl>

        <div class="receipt-barcode" aria-hidden="true"></div>

        <p class="receipt-note">
            This receipt confirms your simulated transaction.<br>
            Please retain it for your records.
        </p>
        <p class="receipt-thanks">*** Thank you for banking with ABC ***</p>
    </article>
</dialog>
