{% load static %}
<dialog class="balance-modal" id="balance-modal" aria-labelledby="balance-title">
    <header class="balance-head">
        <form method="dialog">
            <button class="legal-close" aria-label="Close">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </form>

        <p class="eyebrow eyebrow--amber">Balance inquiry</p>
        <h2 id="balance-title">Total available balance</h2>
        <p class="balance-total" id="balance-total">₱0.00</p>
        <p class="balance-sub" id="balance-sub">Across 2 active accounts</p>
    </header>

    <div class="balance-body">
        <div class="balance-row">
            <span class="icon-tile icon-tile--red" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0 0 12 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75Z" />
                </svg>
            </span>
            <span class="balance-name">
                <strong>Checking Account</strong>
                <small>•••• 4821</small>
            </span>
            <strong class="balance-amount" id="balance-checking">₱0.00</strong>
        </div>

        <div class="balance-row">
            <span class="icon-tile icon-tile--amber" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a2.25 2.25 0 0 0-2.25-2.25H15a3 3 0 1 1-6 0H5.25A2.25 2.25 0 0 0 3 12m18 0v6a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 9m18 0V6a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 6v3" />
                </svg>
            </span>
            <span class="balance-name">
                <strong>Savings Account</strong>
                <small>•••• 9017</small>
            </span>
            <strong class="balance-amount" id="balance-savings">₱0.00</strong>
        </div>

        <p class="balance-note">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
            Balances reflect all transactions completed during this simulator session.
        </p>

        <form method="dialog">
            <button class="btn-amber">Done</button>
        </form>
    </div>
</dialog>
