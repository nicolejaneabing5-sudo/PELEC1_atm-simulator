{% load static %}
<dialog class="history-modal" id="history-modal" aria-labelledby="history-title">
    <header class="history-head">
        <form method="dialog">
            <button class="legal-close" aria-label="Close">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </form>

        <p class="eyebrow">Account history</p>
        <h2 id="history-title">All transactions</h2>
        <p class="history-sub" id="history-count">0 transactions across checking and savings</p>
    </header>

    <!-- rows are drawn by dashboard.js -->
    <ul class="tx-list history-list" id="history-list"></ul>

    <p class="history-foot">Select any transaction to view its receipt.</p>
</dialog>
